
{% extends "base.html" %}
{% load static %}
{% block title %}Settings{% endblock title %}

{% block content %}
<div class="right-mainpart">
    <div class="settings_box">
        <form action="#">
            <div class="settings_wrapper">
                <div class="profile_wrap text-center">
                    <div class="settings_profile">
                        <div class="profile_photo business_photo">
                            <a href="#">
                                <img src="{% static "img\business-logo.png" %}" alt="">
                            </a>
                        </div>
                        <div class="edit_btn">
                            <a href="#">
                                <img src="{% static "img\edit.svg" %}" alt="">
                            </a>
                        </div>
                    </div>
                    <div class="profile_text">
                        <p>Business Logo</p>
                    </div>
                </div>
                <div class="settings_details">
                    <div class="settings_item">
                        <label>Name of Business</label>
                        <input type="text" placeholder="PG Home">
                    </div>
                    <div class="settings_item">
                        <label>Email Address</label>
                        <input type="email" placeholder="pghome@gmail.com">
                    </div>
                    <div class="settings_item">
                        <label>Phone Number</label>
                        <input type="tel" placeholder="+01 234 566 788">
                    </div>
                </div>
                <div class="save_btn">
                    <button type="button">Save</button>
                </div>                           
            </div>
        </form>
    </div>                                              
</div>  
{% endblock content %}
