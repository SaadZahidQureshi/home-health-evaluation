<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="keywords" content="app, landing, corporate, Creative, Html Template, Template">
    <meta name="author" content="web-themes">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1">

    <!-- title -->
    <title>Profile Setting</title>

    <!-- favicon -->
    <link href="{% static "img\favicon.png" %}" type="image/png" rel="icon">

    <!-- all css here -->
    <link href="{% static "css\bootstrap.min.css" %}" rel="stylesheet" type="text/css" />
    <link href="{% static "css\style.css" %}" rel="stylesheet" type="text/css" />
    <link href="{% static "css\responsive.css" %}" rel="stylesheet" type="text/css" />
</head>
<body>

    <!--========== main-wrapper start ===========-->
    <main class="main-wrapper">
        <div class="row g-0">
            <div class="col-lg-3 main-left-col">
                <div class="main-left">
                    <div class="logo_wraper">
                        <a href="#">
                            <img src="{% static "img\logo.svg" %}" alt="">
                        </a>
                        <div class="hamburger-menu d-lg-none">
                            <span class="line-top"></span>
                            <span class="line-center"></span>
                            <span class="line-bottom"></span>
                        </div>
                    </div>
                    <div class="side_menu">
                        <ul>
                            <li>
                                <a href="#"><span>1</span> Keep It Clean</a>
                            </li>
                            <li>
                                <a href="#"><span>2</span> Keep It Dry</a>
                            </li>
                            <li>
                                <a href="#"><span>3</span> Keep It Pest-Free</a>
                            </li>
                            <li>
                                <a href="#"><span>4</span> Keep It Contaminent-Free</a>
                            </li>
                            <li>
                                <a href="#"><span>5</span> Keep It Safe</a>
                            </li>
                            <li>
                                <a href="#"><span>6</span> Keep It Ventilated</a>
                            </li>
                            <li>
                                <a href="#"><span>7</span> Keep It Comfortable</a>
                            </li>
                            <li>
                                <a href="#"><span>8</span> Keep It Maintained</a>
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
            <div class="col-lg-9 main-right-col">
                <div class="main-right">
                    <div class="header_area">
                        <div class="header_title header_title2">
                            <div class="hamburger-menu d-lg-none">
                                <span class="line-top"></span>
                                <span class="line-center"></span>
                                <span class="line-bottom"></span>
                            </div>
                            <div class="back_btn">
                                <a href="#"><img src="{% static "img\left-arrow.svg" %}" alt=""></a>
                            </div>
                            <h2>Profile Setting</h2>
                        </div>
                        <div class="header_right">
                            <ul>
                                <li><a href="#"><img src="{% static "img\save.svg" %}" alt=""></a></li>
                                <li><a href="#"><img src="{% static "img\history.svg" %}" alt=""></a></li>
                                <li>
                                    <div class="dropdown">
                                        <a class="profile_btn" href="#" role="button" id="profile_dropdown" data-bs-toggle="dropdown" aria-expanded="false">
                                            <img src="{% static "img\profile.png" %}" alt="">
                                        </a>
                                        <ul class="dropdown-menu" aria-labelledby="profile_dropdown">
                                            <li><a class="dropdown-item" href="profile-settings.html">Profile Settings</a></li>
                                            <li><a class="dropdown-item" href="settings.html">Settings</a></li>
                                        </ul>
                                    </div>
                                </li>
                            </ul>
                        </div>
                    </div>

                    <div class="right-mainpart">
                        <div class="settings_box">
                            <form action="#">
                                <div class="settings_wrapper">
                                    <div class="profile_wrap text-center">
                                        <div class="settings_profile">
                                            <div class="profile_photo">
                                                <a href="#">
                                                    <img src="{% static "img\profile-photo.png" %}" alt="">
                                                </a>
                                            </div>
                                            <div class="edit_btn">
                                                <a href="#">
                                                    <img src="{% static "img\edit.svg" %}" alt="">
                                                </a>
                                            </div>
                                        </div>
                                        <div class="profile_text">
                                            <p>Profile Photo</p>
                                        </div>
                                    </div>
                                    <div class="settings_details">
                                        <div class="settings_item">
                                            <label>Name</label>
                                            <input type="text" placeholder="Jorden">
                                        </div>
                                        <div class="settings_item">
                                            <label>Email Address</label>
                                            <input type="email" placeholder="jordenjane@gmail.com">
                                        </div>
                                        <div class="settings_item">
                                            <label>Phone Number</label>
                                            <input type="tel" placeholder="+01 234 566 788">
                                        </div>
                                        <div class="settings_item">
                                            <label>Password</label>
                                            <input type="password" placeholder="********">
                                        </div>
                                    </div>
                                    <div class="save_btn">
                                        <button type="button">Save</button>
                                    </div>                           
                                </div>
                            </form>
                        </div>                                               
                    </div>               
                </div>
            </div>
        </div>
    </main>
    <!--========== main-wrapper end ===========-->

    <!-- all js here -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
