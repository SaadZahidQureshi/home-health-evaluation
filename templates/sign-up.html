<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="keywords" content="app, landing, corporate, Creative, Html Template, Template">
    <meta name="author" content="web-themes">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1">

    <!-- title -->
    <title>Sign Up</title>

    <!-- favicon -->
    <link href="img/favicon.png" type="image/png" rel="icon">

    <!-- all css here -->
    <link href="css/bootstrap.min.css" rel="stylesheet" type="text/css" />
    <link href="css/style.css" rel="stylesheet" type="text/css" />
    <link href="css/responsive.css" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- signin_wrapper start -->
    <main class="signin_wrapper">
        <div class="signin_main">
            <div class="signin_circle">
                <img src="img/circle.svg" alt="">
            </div>
            <div class="signin_box">
                <div class="signin_logo">
                    <a href="#">
                        <img src="img/logo-2.svg" alt="">
                    </a>
                </div>
                <div class="line_border">
                    <img src="img/line-2.svg" alt="">
                </div>
                <div class="sign_title text-center">
                    <h3>Sign Up</h3>
                    <p>Please enter your details below</p>
                </div>
                <form action="#">
                    <div class="sign_details">
                        <div class="sign_item">
                            <label>Name</label>
                            <input type="text" placeholder="Jorden">
                        </div>
                        <div class="sign_item">
                            <label>Email</label>
                            <input type="email" placeholder="jorden@gmail.com">
                        </div>
                        <div class="sign_item">
                            <label>Password</label>
                            <input type="password" placeholder="*****">
                        </div>
                        <div class="sign_item">
                            <label>Confirm Password</label>
                            <input type="password" placeholder="*****">
                        </div>
                        <div class="sign_bottom signup_bottom">
                            <div class="sign_btn">
                                <button type="button">Sign Up</button>
                            </div>
                            <p>Already have an account? <a href="#">Sign In</a></p>
                        </div>
                    </div>
                </form>                
            </div>
        </div>
    </main>
    <!-- signin_wrapper end -->

    <!-- all js here -->
    <script src="js/jquery-3.4.1.min.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
