<!-- Bootstrap Delete Confirmation Modal -->
<div class="modal fade" id="deleteConfirmModal" tabindex="-1" aria-labelledby="deleteConfirmLabel" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content rounded-3 shadow">
      <div class="modal-header border-0">
        <button type="button" class="btn-close visibility-hidden" data-bs-dismiss="modal" aria-label="Close"></button>
        <h5 class="modal-title text-danger fw-bold" id="deleteConfirmLabel">
          Confirm Deletion
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body text-center">
        <img src="/static/img/delete-rounded.svg" width="50" class="mb-3">
        <p class="fs-6 mb-0">Are you sure you want to delete this record?</p>
      </div>
      <div class="modal-footer border-0 justify-content-center">
        <button type="button" class="btn px-4" data-bs-dismiss="modal" style="background-color: #71BF1E; color: #ffffff;">Cancel</button>
        <button type="button" id="confirmDeleteBtn" class="btn btn-danger px-4">Delete</button>
      </div>
    </div>
  </div>
</div>
