    <!-- Second Modal: What would you like to do next -->
    <div class="modal fade" id="nextActionsModal" tabindex="-1" aria-hidden="true" data-bs-backdrop="static">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="d-flex align-items-center w-100">
                        <div class="back-button" onclick="goBack()">
                            <svg viewBox="0 0 24 24">
                                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" fill="white"/>
                            </svg>
                        </div>
                        <h5 class="modal-title flex-grow-1 ms-3">What would you like to do next ?</h5>
                    </div>
                </div>
                <div class="modal-body">
                    <div class="action-list">
                        <div class="action-item" onclick="editInformation()">Edit Information</div>
                        <div class="action-item primary" onclick="reschedule()">Reschedule</div>
                        <div class="action-item" onclick="cancelAppointment()">Cancel Appointment</div>
                        <div class="action-item" onclick="scheduleNew()">Schedule New Appointment</div>
                    </div>
                </div>
            </div>
        </div>
