

<div class="modal fade" id="updatePassword" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="updatePasswordLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
        <div class="modal-header border-0">
            <h1 class="modal-title m-auto" id="updatePasswordLabel">Update Password</h1>
            <svg class="position-absolute" style="right:1rem" data-bs-dismiss="modal" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.8076 5.08008C18.1147 4.77312 18.6129 4.77303 18.9199 5.08008C19.227 5.38713 19.2269 5.88528 18.9199 6.19238L13.1123 12L18.9199 17.8076C19.1928 18.0806 19.2228 18.5041 19.0107 18.8105L19.0029 18.8223L19.002 18.8213L18.9287 18.9102L18.9199 18.9199C18.6468 19.193 18.2226 19.2231 17.916 19.0107L17.9053 19.0029L18.002 18.8877L17.9053 19.002L17.8174 18.9287L17.8076 18.9199L12 13.1123L6.19238 18.9199C5.88528 19.2269 5.38713 19.227 5.08008 18.9199C4.77303 18.6129 4.77312 18.1147 5.08008 17.8076L10.8877 12L5.08008 6.19238C4.80721 5.91939 4.77717 5.49593 4.98926 5.18945L4.99707 5.17773H4.99902L5.07129 5.08984L5.08008 5.08008L5.18945 4.98926C5.41935 4.83008 5.71518 4.80711 5.96387 4.9209L6.08398 4.98926L6.09473 4.99707L5.99805 5.1123L6.09473 4.99805L6.18262 5.07129L6.19238 5.08008L12 10.8877L17.8076 5.08008Z" fill="#FF0000" stroke="#FF0000" stroke-width="0.3"/>
            </svg>
        </div>
        <form class="modal-body" id="UpdatePasswordForm">
            {% csrf_token %}
            <div class="sign_item">
                <label for="old_password">Password</label>
                <input type="password" name="old_password" id="old_password" placeholder="*****">
                <button type="button" class="password-toggle" onclick="togglePassword('old_password')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3.3" stroke="#98FB98" stroke-width="1.4"></circle>
                        <path d="M20.188 10.9343C20.5762 11.4056 20.7703 11.6412 20.7703 12C20.7703 12.3588 20.5762 12.5944 20.188 13.0657C18.7679 14.7899 15.6357 18 12 18C8.36427 18 5.23206 14.7899 3.81197 13.0657C3.42381 12.5944 3.22973 12.3588 3.22973 12C3.22973 11.6412 3.42381 11.4056 3.81197 10.9343C5.23206 9.21014 8.36427 6 12 6C15.6357 6 18.7679 9.21014 20.188 10.9343Z" stroke="#98FB98" stroke-width="1.7"></path>
                        <path d="M20 5L5 20" stroke="#98FB98" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
            <div class="sign_item">
                <label for="new_password">New Password</label>
                <input type="password" name="new_password" id="new_password" placeholder="*****">
                <button type="button" class="password-toggle" onclick="togglePassword('new_password')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3.3" stroke="#98FB98" stroke-width="1.4"></circle>
                        <path d="M20.188 10.9343C20.5762 11.4056 20.7703 11.6412 20.7703 12C20.7703 12.3588 20.5762 12.5944 20.188 13.0657C18.7679 14.7899 15.6357 18 12 18C8.36427 18 5.23206 14.7899 3.81197 13.0657C3.42381 12.5944 3.22973 12.3588 3.22973 12C3.22973 11.6412 3.42381 11.4056 3.81197 10.9343C5.23206 9.21014 8.36427 6 12 6C15.6357 6 18.7679 9.21014 20.188 10.9343Z" stroke="#98FB98" stroke-width="1.7"></path>
                        <path d="M20 5L5 20" stroke="#98FB98" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>
            <div class="sign_item">
                <label for="confirm_password">Confirm New Password</label>
                <input type="password" name="confirm_password" id="confirm_password" placeholder="*****">
                <button type="button" class="password-toggle" onclick="togglePassword('confirm_password')">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <circle cx="12" cy="12" r="3.3" stroke="#98FB98" stroke-width="1.4"></circle>
                        <path d="M20.188 10.9343C20.5762 11.4056 20.7703 11.6412 20.7703 12C20.7703 12.3588 20.5762 12.5944 20.188 13.0657C18.7679 14.7899 15.6357 18 12 18C8.36427 18 5.23206 14.7899 3.81197 13.0657C3.42381 12.5944 3.22973 12.3588 3.22973 12C3.22973 11.6412 3.42381 11.4056 3.81197 10.9343C5.23206 9.21014 8.36427 6 12 6C15.6357 6 18.7679 9.21014 20.188 10.9343Z" stroke="#98FB98" stroke-width="1.7"></path>
                        <path d="M20 5L5 20" stroke="#98FB98" stroke-width="1.5" stroke-linecap="round"></path>
                    </svg>
                </button>
            </div>           
        </form>
        <div class="modal-footer border-0 d-flex justify-content-center">
            <button type="submit" form="UpdatePasswordForm">
                <span class="spinner-border spinner-border-sm hide" role="status" aria-hidden="true"></span>
                <span class="btn-text">Save</span>
            </button>
        </div>
        </div>
    </div>
</div>
<input type="hidden" class="updatePassword" data-bs-toggle="modal" data-bs-target="#updatePassword">
