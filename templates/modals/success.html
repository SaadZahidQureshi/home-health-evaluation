

<div class="modal fade" id="generateTokenModal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="generateTokenModal" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content">
        <div class="modal-header border-0">
            <h1 class="modal-title m-auto" id="successmodalLabel">Generate Auth Token</h1>
            <svg class="position-absolute" style="right:1rem" data-bs-dismiss="modal" width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M17.8076 5.08008C18.1147 4.77312 18.6129 4.77303 18.9199 5.08008C19.227 5.38713 19.2269 5.88528 18.9199 6.19238L13.1123 12L18.9199 17.8076C19.1928 18.0806 19.2228 18.5041 19.0107 18.8105L19.0029 18.8223L19.002 18.8213L18.9287 18.9102L18.9199 18.9199C18.6468 19.193 18.2226 19.2231 17.916 19.0107L17.9053 19.0029L18.002 18.8877L17.9053 19.002L17.8174 18.9287L17.8076 18.9199L12 13.1123L6.19238 18.9199C5.88528 19.2269 5.38713 19.227 5.08008 18.9199C4.77303 18.6129 4.77312 18.1147 5.08008 17.8076L10.8877 12L5.08008 6.19238C4.80721 5.91939 4.77717 5.49593 4.98926 5.18945L4.99707 5.17773H4.99902L5.07129 5.08984L5.08008 5.08008L5.18945 4.98926C5.41935 4.83008 5.71518 4.80711 5.96387 4.9209L6.08398 4.98926L6.09473 4.99707L5.99805 5.1123L6.09473 4.99805L6.18262 5.07129L6.19238 5.08008L12 10.8877L17.8076 5.08008Z" fill="#FF0000" stroke="#FF0000" stroke-width="0.3"/>
            </svg>
        </div>
        <form class="modal-body" id="generateTokenForm">
            {% csrf_token %}

            <div class="sign_item w-100">
                <label>Email address</label>
                <input type="email" name="email-address" placeholder="jorden@gmail.com" required>
            </div>
            <div class="w-100">
                <p class="token-label">Auth Token:</p>
                <p class="token-description">Generated token should be display here.</p>
                
            </div>

            <!-- <div class="main-content-delete">
                
                <span>Your Form has been submitted successfully.</span>
            </div> -->

        </form>
        <div class="modal-footer border-0 ">
            <button type="button" id="generateTokenBtn" form="generateTokenForm" class="btn btn-primary">
                <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                <span class="btn-text">Continue</span>
            </button>
        </div>
        </div>
    </div>
</div>
<input type="hidden" class="generateTokenModal" data-bs-toggle="modal" data-bs-target="#generateTokenModal">
