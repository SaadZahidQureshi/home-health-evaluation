<!DOCTYPE html>
<html lang="en">
{% load static %}
<head>
    <meta charset="utf-8">
    <meta name="description" content="">
    <meta name="keywords" content="app, landing, corporate, Creative, Html Template, Template">
    <meta name="author" content="web-themes">
    <meta http-equiv="x-ua-compatible" content="ie=edge">
    <meta name="viewport" content="width=device-width, minimum-scale=1.0, maximum-scale=1.0, initial-scale=1">
    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">
    <!-- title -->
    <title>Sign In</title>

    <!-- favicon -->
    <link href="{% static "img\favicon.png" %}" type="image/png" rel="icon">

    <!-- all css here -->
    <link href="{% static "css\bootstrap.min.css" %}" rel="stylesheet" type="text/css" />
    <link href="{% static "css\style.css" %}" rel="stylesheet" type="text/css" />
    <link href="{% static "css\responsive.css" %}" rel="stylesheet" type="text/css" />
</head>
<body>

    <!-- signin_wrapper start -->
    <main class="signin_wrapper">
        <div class="signin_main">
            <div class="signin_circle">
                <img src="{% static 'img/circle.svg' %}" alt="">
            </div>
            <div class="signin_box">
                <div class="signin_logo">
                    <a href="#">
                        <img src="{% static 'img/logo-2.svg' %}" alt="">
                    </a>
                </div>
                <div class="line_border">
                    <img src="{% static 'img/line-2.svg' %}" alt="">
                </div>
                <div class="sign_title text-center">
                    <h3>Sign In</h3>
                    <p>Please enter your details below</p>
                </div>
                <form action="#" id="loginForm">
                    {% csrf_token %}
                    <input type="hidden" name="next" value="{{ request.GET.next }}">
                    <div class="sign_details">
                        <div class="sign_item">
                            <label>Email</label>
                            <input type="email" name="email" placeholder="alexjohn@gmail.com" required>
                        </div>
                        <div class="sign_item">
                            <label>Password</label>
                            <div class="password-container position-relative">
                                <input type="password" name="password" id="password" placeholder="*****" required>
                                <button style="top: 30%;" type="button" class="password-toggle" onclick="togglePassword('password')">
                                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                        <circle cx="12" cy="12" r="3.3" stroke="#98FB98" stroke-width="1.4"></circle>
                                        <path d="M20.188 10.9343C20.5762 11.4056 20.7703 11.6412 20.7703 12C20.7703 12.3588 20.5762 12.5944 20.188 13.0657C18.7679 14.7899 15.6357 18 12 18C8.36427 18 5.23206 14.7899 3.81197 13.0657C3.42381 12.5944 3.22973 12.3588 3.22973 12C3.22973 11.6412 3.42381 11.4056 3.81197 10.9343C5.23206 9.21014 8.36427 6 12 6C15.6357 6 18.7679 9.21014 20.188 10.9343Z" stroke="#98FB98" stroke-width="1.7"></path>
                                        <path d="M20 5L5 20" stroke="#98FB98" stroke-width="1.5" stroke-linecap="round"></path>
                                    </svg>
                                </button>
                            </div>
                        </div>
                        <div class="sign_bottom">
                            <div class="sign_btn">
                                <button type="submit">
                                    <span class="spinner-border hide" role="status" aria-hidden="true"></span>
                                    <span class="btn-text">Sign In</span>
                                </button>
                            </div>
                            <p>Don’t have an account? <a href="/register/">Sign Up</a></p>
                        </div>
                    </div>
                </form>                
            </div>
        </div>
    </main>
    <!-- signin_wrapper end -->
    {{API_BASE_URL|json_script:"API_BASE_URL"}}
    <!-- all js here -->
    <script src="{% static "js\jquery-3.4.1.min.js" %}"></script>
    <script src="{% static "js\bootstrap.bundle.min.js" %}"></script>
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>
    <script src="{% static "js\main.js" %}"></script>
    <script src="{% static "js\login.js" %}"></script>
</body>
</html>
