{% extends 'home/home_base.html' %}
{% load static %}

{% block css %}
<link rel="stylesheet" href="{% static 'css/home/book-appointments.css' %}" />
{% endblock css %}
   
{% block title %} Appointments {% endblock title %}
    
{% block content %}

<div class="main-container">
    <div class="heading-container">
        <span class="mission-badge">Appointments</span>
        <h2>Book appointments with us</h2>
    </div>
    <div class="calendar-container">
        <h2 class="month-title" id="monthTitle">September 2025</h2>
        <div class="date-selector-wrapper">
            <button class="nav-arrow left-arrow" id="leftArrow">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M19.1431 8.85693H5.23456L11.6231 2.46836L10.0003 0.856934L0.857422 9.99979L10.0003 19.1426L11.6117 17.5312L5.23456 11.1426H19.1431V8.85693Z" fill="white"></path>
                </svg>
            </button>
            <div class="date-selector" id="dateSelector">
                <div class="dates-container" id="datesContainer">
                    
                </div>
            </div>
            <button class="nav-arrow right-arrow" id="rightArrow">
                <svg width="15" height="15" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M10.0003 0.856934L8.38885 2.46836L14.766 8.85693H0.857422V11.1426H14.766L8.38885 17.5312L10.0003 19.1426L19.1431 9.99979L10.0003 0.856934Z" fill="white"></path>
                </svg>
            </button>
        </div>
        <div class="slots-container">
            <h3 data-i18n="book-appointment-available-slot">Available Slot <span class="slots-timing">(4 Hours)</span></h3>
            <div class="slots">
                <input type="radio" name="available_slot" class="slot-input" id="12574" />
                <label class="slot" for="12574" data-slot-id="12574" slot-selector-div="14:45:00">08:00 AM to 12:00 PM</label>
                <input type="radio" name="available_slot" class="slot-input" id="12575" checked />
                <label class="slot" for="12575" data-slot-id="12575" slot-selector-div="15:00:00">01:00 PM to 05:00 PM</label>
            </div>
        </div>
    </div>
    <div class="continue-btn">
        <button onclick="location.pathname = '/appointment-details/'">Continue</button>
    </div>
</div>

{% endblock content %}

{% block js %}
<script src="{% static 'js/home/bookAppointments.js' %}"></script>
{% endblock js %}
