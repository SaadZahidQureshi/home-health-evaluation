{% extends 'home/home_base.html' %}

  {% block css %}
    <link rel="stylesheet" href="/static/css/home/appointment-details.css">
  {% endblock css %}
   {% block title %} About Us {% endblock title %}
    
{% block content %}
    <div class="main-container">
         <div class="booking-container">
        <div class="booking-header">
            <h1 class="booking-title">You are booking: Appointment Booking</h1>
        </div>
        
        <form class="booking-form">
            <div class="form-row">
                <div class="form-group">
                    <label for="firstName">First Name</label>
                    <input type="text" id="firstName" placeholder="Alex">
                </div>
                <div class="form-group">
                    <label for="lastName">Last Name</label>
                    <input type="text" id="lastName" placeholder="John">
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Alex.john@gmail.com">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" placeholder="+92 3455555 677">
                </div>
                <div class="form-group">
                    <label for="address">Address</label>
                    <input type="text" id="address" placeholder="115, New York, USA">
                </div>
                <div class="form-group">
                    <label for="zipCode">Zip Code</label>
                    <input type="text" id="zipCode" placeholder="Texas">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="city">City</label>
                    <input type="text" id="city" placeholder="New York">
                </div>
                <div class="form-group">
                    <label for="state">State</label>
                    <input type="text" id="state" placeholder="Texas">
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group notes">
                    <label for="notes">Notes</label>
                    <textarea id="notes" placeholder="Write down"></textarea>
                </div>
            </div>
            
            <div class="book-button-container">
                <button type="submit" class="book-button">Book Now</button>
            </div>
        </form>
    </div>
    </div>

{% endblock content %}
{% block js %}
        
{% endblock js %}
